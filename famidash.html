<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Algebra Practice - Module 1.2.8</title>
    <style>
        body { 
            margin: 0; 
            background: #0f0f0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif;
        }

        #game { 
            width: 100vw; 
            height: 100vh; 
            display: none;
        }

        #start { 
            padding: 20px 40px; 
            font-size: 18px;
            font-weight: bold;
            color: white; 
            border: none; 
            border-radius: 50px;
            cursor: pointer; 
            background: linear-gradient(135deg, #8e2de2, #4caf50);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <button id="start">Play Famidash On Algebra Practice</button>
    <div id="game"></div>

    <script>
        document.getElementById('start').addEventListener('click', function() {
            const btn = this;
            const gameDiv = document.getElementById('game');
            
            // Configuration
            window.EJS_player = "#game";
            window.EJS_core = "nes";
            // Check: Is your file EXACTLY named this on GitHub?
            window.EJS_gameUrl = "Famidash.v1.2.8.nes"; 
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Load the script
            let script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            
            script.onload = function() {
                btn.style.display = 'none';
                gameDiv.style.display = 'block';
                console.log("Emulator engine loaded.");
            };

            script.onerror = function() {
                alert("Failed to load the emulator engine. Your school might be blocking the CDN.");
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
